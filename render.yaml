services:
  - type: web
    name: visit-ao
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: OWNER_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: visit-ao-data
      mountPath: /var/data
      sizeGB: 1
